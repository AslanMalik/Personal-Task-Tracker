<div class="task-page">
  <div class="container">
    <header class="header">
      <h1>My Workspace</h1>
      <p>Manage your tasks and categories</p>
    </header>

    <div class="create-card">
      <div class="input-row">
        <input type="text" [(ngModel)]="newTask.title" placeholder="Task title (required)" style="flex: 2;"/>
        
        <select [(ngModel)]="newTask.category" style="flex: 1;">
          <option [ngValue]="undefined">No Category</option>
          @for (cat of taskService.categories(); track cat.id) {
            <option [ngValue]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>
      
      <div class="input-row" style="margin-top: 15px;">
        <input type="text" [(ngModel)]="newTask.description" (keyup.enter)="createTask()" placeholder="Task description (optional)..." style="flex: 3;"/>
        <button (click)="createTask()" [disabled]="!newTask.title">Add Task</button>
      </div>
    </div>

    <div class="task-list">
      @for (task of taskService.tasks(); track task.id) {
        <div class="task-card" [class.done]="task.status === 'done'">
          <div class="status-indicator" [attr.data-status]="task.status"></div>
          
          <div class="task-content">
            <div class="task-header">
              <h3>{{ task.title }}</h3>
              @if (task.category) {
                <span class="category-badge">{{ getCategoryName(task.category) }}</span>
              }
            </div>
            <p class="description">{{ task.description || 'No description provided' }}</p>
          </div>

          <div class="actions" style="display: flex; gap: 10px; align-items: center;">
            <select [ngModel]="task.status" (ngModelChange)="changeStatus(task, $event)">
              <option value="todo">To Do</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
            <button class="delete-btn" (click)="deleteTask(task.id!)">Delete</button>
          </div>
        </div>
      } @empty {
        <div class="empty-state">No tasks found. Add one above!</div>
      }
    </div>
  </div>
</div>
